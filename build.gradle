plugins {
    id 'org.springframework.boot' version '3.5.0' apply false
    id 'io.spring.dependency-management' version '1.1.7' apply false
    id 'com.google.protobuf' version '0.9.4' apply false

    id 'com.github.spotbugs' version '5.0.14' apply false
    id 'com.diffplug.spotless' version '6.22.0' apply false
    id 'com.star-zero.gradle.githook' version '1.2.1' apply false
}

// Configuration
subprojects {
    if (file('src/main/java').exists()) {  // Only apply to projects with actual Java source code
        apply plugin: 'java'
        apply plugin: 'org.springframework.boot'
        apply plugin: 'io.spring.dependency-management'
        
        // Code Quality Tools
        // apply plugin: 'checkstyle'  // Disabled for simpler development
        // apply plugin: 'com.github.spotbugs'  // Still disabled due to Java 24 compatibility
        // apply plugin: 'pmd'  // Temporarily disabled due to Java module issues
        apply plugin: 'com.diffplug.spotless'  // Only keep code formatting
        apply plugin: 'com.star-zero.gradle.githook'

        group = 'com.example'
        version = '0.0.1-SNAPSHOT'

        java {
            toolchain {
                languageVersion = JavaLanguageVersion.of(24)
            }
        }

        repositories {
            mavenCentral()
        }

        // Common dependencies cho tất cả Java services
        dependencies {
            implementation 'org.springframework.boot:spring-boot-starter'
            implementation 'org.springframework.boot:spring-boot-starter-web'
            implementation 'org.springframework.boot:spring-boot-starter-validation'
            
            // Environment variables support
            implementation 'me.paulschwarz:spring-dotenv:4.0.0'
            
            // Test dependencies
            testImplementation 'org.springframework.boot:spring-boot-starter-test'
            testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
        }

        // Checkstyle Configuration - Disabled for simpler development
        // checkstyle {
        //     toolVersion = '10.12.4'
        //     configFile = resources.text.fromUri('https://raw.githubusercontent.com/checkstyle/checkstyle/master/src/main/resources/google_checks.xml').asFile()
        //     maxWarnings = 0
        //     maxErrors = 0
        // }

        // SpotBugs Configuration - Temporarily disabled
        // spotbugs {
        //     ignoreFailures = false
        //     effort = 'max'
        //     reportLevel = 'low'
        // }

        // PMD Configuration - Temporarily disabled
        // pmd {
        //     consoleOutput = true
        //     toolVersion = "6.55.0"
        //     rulesMinimumPriority = 5
        // }

        // Spotless Configuration (Code Formatting)
        spotless {
            java {
                googleJavaFormat('1.17.0').aosp().reflowLongStrings()
                removeUnusedImports()
                trimTrailingWhitespace()
                endWithNewline()
                
                // Consistent formatting across all services
                indentWithSpaces(4)
                importOrder('java', 'javax', 'org.springframework', 'org', 'com')
            }
        }

        // Git Hooks Configuration
        githook {
            failOnMissingHooksDir = false
            hooks {
                'pre-commit' {
                    task = 'spotlessCheck'
                }
                'pre-push' {
                    task = 'check'
                }
            }
        }

        tasks.named('test') {
            useJUnitPlatform()
        }
    }
}

// Global tasks
task formatAll {
    description = 'Format code in all Java services'
    group = 'formatting'
    
    subprojects.each { subproject ->
        if (subproject.tasks.findByName('spotlessApply')) {
            dependsOn subproject.tasks.spotlessApply
        }
    }
}

task checkAll {
    description = 'Run all quality checks on Java services'
    group = 'verification'
    
    subprojects.each { subproject ->
        if (subproject.tasks.findByName('check')) {
            dependsOn subproject.tasks.check
        }
    }
}
